      <text x="20" y="27" text-anchor="middle" font-size="16" font-weight="900" fill="#030712" font-family="system-ui, sans-serif">SM</text>
      <text x="54" y="18" font-size="15" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif">Shubham Mane</text>
      <text x="54" y="36" font-size="12" font-weight="600" fill="#94a3b8" font-family="system-ui, sans-serif">Cloud • DevOps • AI • SRE Engineer | github.com/shubhu-io</text>
