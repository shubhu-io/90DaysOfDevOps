          <circle cx="32" cy="5" r="3" fill="#f59e0b" />
          <line x1="55" y1="-1" x2="80" y2="-8" stroke="#00f2fe" stroke-width="2" />
        </g>
        <g transform="translate(15, 170)">
          <polygon points="0,0 90,-25 90,-5 0,20" fill="#020617" stroke="#00f2fe" stroke-width="1" />
          <circle cx="20" cy="8" r="3" fill="#10b981" filter="url(#bloom)" />
          <circle cx="32" cy="5" r="3" fill="#00f2fe" />
          <line x1="55" y1="-1" x2="80" y2="-8" stroke="#00f2fe" stroke-width="2" />
        </g>
        <g transform="translate(15, 225)">
