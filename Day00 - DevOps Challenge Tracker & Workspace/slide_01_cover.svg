          <line x1="10" y1="35" x2="85" y2="13" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
          <line x1="10" y1="60" x2="85" y2="38" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
          <line x1="10" y1="85" x2="85" y2="63" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
        </g>
      </g>

      <!-- Fiber Optic Conduit Connecting Towers -->
