        <polygon points="120,0 200,30 200,350 120,320" fill="#0a0f1d" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
        <polygon points="0,40 120,0 200,30 80,70" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
        
