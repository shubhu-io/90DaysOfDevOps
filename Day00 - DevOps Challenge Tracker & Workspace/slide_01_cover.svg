      <text x="16" y="19" font-size="11" font-weight="900" fill="#00f2fe" font-family="system-ui, sans-serif">⚡ ARCHITECTURE NODE</text>
      <text x="16" y="52" font-size="11" font-weight="700" fill="#94a3b8" font-family="ui-monospace, monospace">NODE: ACTIVE (PROD)</text>
      <rect x="16" y="60" width="178" height="6" rx="3" fill="#1e293b" />
      <rect x="16" y="60" width="125" height="6" rx="3" fill="#10b981" />
      
      <text x="16" y="88" font-size="11" font-weight="700" fill="#94a3b8" font-family="ui-monospace, monospace">DRIFT: 0.00% ZERO-DRIFT</text>
      <rect x="16" y="96" width="178" height="6" rx="3" fill="#1e293b" />
      <rect x="16" y="96" width="178" height="6" rx="3" fill="#00f2fe" />

      <text x="16" y="124" font-size="10" font-weight="800" fill="#10b981" font-family="ui-monospace, monospace">● RECOVERY: AUTOMATED</text>
