    <g transform="translate(180, -70)">
      <rect width="260" height="170" rx="14" fill="rgba(2, 6, 23, 0.9)" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M 0 14 Q 0 0 14 0 L 246 0 Q 260 0 260 14 L 260 28 L 0 28 Z" fill="rgba(30, 41, 59, 0.8)" />
      <circle cx="16" cy="14" r="4" fill="#ff5f56" /><circle cx="28" cy="14" r="4" fill="#ffbd2e" /><circle cx="40" cy="14" r="4" fill="#27c93f" />
      <text x="54" y="18" font-size="10" font-weight="800" fill="#cbd5e1" font-family="ui-monospace, monospace">runtime_verification.sh</text>
      
      <text x="16" y="52" font-size="10" fill="#34d399" font-family="ui-monospace, monospace">$ ./verify --day 00</text>
      <text x="16" y="72" font-size="9.5" fill="#94a3b8" font-family="ui-monospace, monospace">[PASS] Architecture baseline</text>
      <text x="16" y="92" font-size="9.5" fill="#94a3b8" font-family="ui-monospace, monospace">[PASS] Zero-drift assertions</text>
      <text x="16" y="112" font-size="10" fill="#38bdf8" font-family="ui-monospace, monospace">$ cat telemetry_report.json</text>
      <text x="16" y="132" font-size="10" font-weight="800" fill="#10b981" font-family="ui-monospace, monospace">exit_code: 0 (NOMINAL)</text>
      
      <rect x="16" y="142" width="130" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
      <text x="81" y="155" text-anchor="middle" font-size="9" font-weight="900" fill="#10b981" font-family="system-ui, sans-serif">100% PRODUCTION PASS</text>
