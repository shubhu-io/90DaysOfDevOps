<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0a1530" /><stop offset="55%" stop-color="#040914" /><stop offset="100%" stop-color="#010307" />
    </radialGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#010307" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" /><stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#heroBg)" />
  <rect width="1080" height="1080" fill="url(#heroGlow)" />

  <!-- 3D Perspective Isometric Grid Floor -->
  <g opacity="0.15" stroke="#00f2fe" stroke-width="1">
    <line x1="540" y1="520" x2="-200" y2="1180" />
    <line x1="540" y1="520" x2="60" y2="1180" />
    <line x1="540" y1="520" x2="300" y2="1180" />
    <line x1="540" y1="520" x2="540" y2="1180" />
    <line x1="540" y1="520" x2="780" y2="1180" />
    <line x1="540" y1="520" x2="1020" y2="1180" />
    <line x1="540" y1="520" x2="1280" y2="1180" />
    <ellipse cx="540" cy="740" rx="380" ry="110" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" />
    <ellipse cx="540" cy="850" rx="520" ry="150" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.4" />
    <ellipse cx="540" cy="980" rx="680" ry="190" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Top Navigation Header -->
  <g transform="translate(60, 48)">
    <rect width="450" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="url(#pGrad)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#00f2fe" filter="url(#bloom)" />
    <text x="44" y="26" font-size="12" font-weight="900" fill="#f8fafc" font-family="system-ui, sans-serif" letter-spacing="2">90 DAYS OF DEVOPS • 2026 → 2027</text>
  </g>
  <g transform="translate(860, 44)">
    <rect width="160" height="48" rx="24" fill="url(#pGrad)" />
    <text x="80" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#030712" font-family="system-ui, sans-serif" letter-spacing="1.5">DAY 00 / 90</text>
  </g>

  <!-- Level 3: Project Hero Title -->
  <text x="60" y="148" font-size="13" font-weight="800" fill="#00f2fe" font-family="system-ui, sans-serif" letter-spacing="3">LINUX &amp; AUTOMATION</text>
  <text x="60" y="180" font-size="34" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif" letter-spacing="-0.8">DevOps Challenge</text>
  <text x="60" y="222" font-size="34" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif" letter-spacing="-0.8">Tracker &amp; Workspace</text>
  
