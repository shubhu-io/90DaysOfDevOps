      <text x="46" y="16" font-size="13" font-weight="800" fill="#ffffff" font-family="system-ui, sans-serif">Shubham Mane</text>
      <text x="46" y="32" font-size="11" font-weight="600" fill="#94a3b8" font-family="system-ui, sans-serif">Cloud &amp; DevOps Engineer • github.com/shubhu-io</text>
    </g>
    <g transform="translate(740, 18)">
