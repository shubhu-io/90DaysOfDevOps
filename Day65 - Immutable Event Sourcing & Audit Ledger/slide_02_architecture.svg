    </g>
    <text x="70" y="170" text-anchor="middle" font-size="12" font-weight="800" fill="#10b981" font-family="system-ui, sans-serif">APP DAEMON</text>
  </g>

  <!-- STAGE 5: MONITORING / TELEMETRY SINK -->
  <g transform="translate(930, 400)">
    <polygon points="0,30 70,0 140,30 70,60" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="0,30 70,60 70,120 0,90" fill="#090d16" stroke="rgba(255,255,255,0.1)" />
    <polygon points="70,60 140,30 140,90 70,120" fill="#04070e" stroke="rgba(255,255,255,0.1)" />
    <g transform="translate(-25, -120)">
      <rect width="180" height="120" rx="12" fill="rgba(11, 18, 33, 0.9)" stroke="#c084fc" stroke-width="1.5" />
      <rect width="180" height="26" rx="12" fill="rgba(0, 242, 254, 0.15)" />
      <text x="90" y="18" text-anchor="middle" font-size="11" font-weight="900" fill="#c084fc" font-family="system-ui, sans-serif">5. MONITORING</text>
      <text x="16" y="50" font-size="11" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">Telemetry Sink</text>
      <text x="16" y="68" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">telemetry.json</text>
      <text x="16" y="86" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">Prometheus / Grafana</text>
      <circle cx="160" cy="100" r="5" fill="#10b981" filter="url(#bloom2)" />
    </g>
    <text x="70" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#c084fc" font-family="system-ui, sans-serif">OBSERVABILITY</text>
  </g>

  <!-- Technical Spec Summary Card at Bottom -->
  <g transform="translate(60, 780)">
    <rect width="960" height="180" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <rect width="960" height="38" rx="18" fill="rgba(30, 41, 59, 0.6)" />
    <circle cx="28" cy="19" r="5" fill="#ff5f56" /><circle cx="44" cy="19" r="5" fill="#ffbd2e" /><circle cx="60" cy="19" r="5" fill="#27c93f" />
    <text x="80" y="24" font-size="12" font-weight="800" fill="#cbd5e1" font-family="ui-monospace, monospace">architecture_specification.hcl</text>

    <g transform="translate(30, 60)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#c084fc" font-family="system-ui, sans-serif">PROTOCOL SPECIFICATION</text>
      <text x="0" y="44" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Ingress: Strict Mutual TLS (mTLS)</text>
      <text x="0" y="66" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Encryption: AES-256-GCM / SHA384</text>
      <text x="0" y="88" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Wire Format: Machine JSON Telemetry</text>
    </g>
    <g transform="translate(360, 60)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#ec4899" font-family="system-ui, sans-serif">ISOLATION &amp; RUNTIME</text>
      <text x="0" y="44" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Isolation: Kernel cgroups &amp; namespaces</text>
      <text x="0" y="66" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Trapping: Defensive signals (SIGTERM)</text>
      <text x="0" y="88" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Self-Healing: Automated supervisor loops</text>
    </g>
    <g transform="translate(700, 60)">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#10b981" font-family="system-ui, sans-serif">SRE SLA GUARANTEES</text>
      <text x="0" y="44" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• High Availability: 99.99% Uptime Target</text>
      <text x="0" y="66" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Sampling Frequency: 1000ms Probes</text>
      <text x="0" y="88" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">• Telemetry Drift: 0.00% Zero-Drift</text>
    </g>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(60, 990)">
    <text x="0" y="16" font-size="12" font-weight="700" fill="#64748b" font-family="system-ui, sans-serif">ARCHITECTURAL TOPOLOGY • 90 DAYS OF DEVOPS • SHUBHAM MANE</text>
    <text x="960" y="16" text-anchor="end" font-size="12" font-weight="800" fill="#10b981" font-family="system-ui, sans-serif">VERIFIED ARCHITECTURE ✓</text>
  </g>
</svg>
