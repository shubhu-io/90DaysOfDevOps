<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="concBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1226" /><stop offset="60%" stop-color="#040813" /><stop offset="100%" stop-color="#010206" />
    </radialGradient>
    <linearGradient id="pGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" /><stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" /><stop offset="35%" stop-color="#6366f1" /><stop offset="70%" stop-color="#a855f7" /><stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="bloom3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#concBg)" />

  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="1080" /><line x1="240" y1="0" x2="240" y2="1080" /><line x1="360" y1="0" x2="360" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" /><line x1="600" y1="0" x2="600" y2="1080" /><line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="840" y1="0" x2="840" y2="1080" /><line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="0" y1="120" x2="1080" y2="120" /><line x1="0" y1="240" x2="1080" y2="240" /><line x1="0" y1="360" x2="1080" y2="360" />
    <line x1="0" y1="480" x2="1080" y2="480" /><line x1="0" y1="600" x2="1080" y2="600" /><line x1="0" y1="720" x2="1080" y2="720" />
    <line x1="0" y1="840" x2="1080" y2="840" /><line x1="0" y1="960" x2="1080" y2="960" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 48)">
    <rect width="500" height="40" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="url(#pGrad3)" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#0ea5e9" filter="url(#bloom3)" />
    <text x="44" y="25" font-size="12" font-weight="900" fill="#f8fafc" font-family="system-ui, sans-serif" letter-spacing="2">90 DAYS OF DEVOPS • CONCEPT VISUALIZATION</text>
  </g>
  <g transform="translate(860, 44)">
    <rect width="160" height="48" rx="24" fill="url(#pGrad3)" />
    <text x="80" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#030712" font-family="system-ui, sans-serif" letter-spacing="1.5">SLIDE 03 / 05</text>
  </g>

  <text x="60" y="130" font-size="13" font-weight="800" fill="#0ea5e9" font-family="system-ui, sans-serif" letter-spacing="2.5">CORE ARCHITECTURAL MECHANISM</text>
  <text x="60" y="170" font-size="32" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif">The Inner Engineering Mechanism</text>
  <text x="60" y="200" font-size="15" fill="#94a3b8" font-family="system-ui, sans-serif">How data flows and state transforms beneath the surface in Kubernetes</text>

  <!-- Glowing Fluid Data Conduit -->
  <g transform="translate(60, 490)">
    <path d="M 50,0 L 280,0 L 510,0 L 740,0 L 910,0" fill="none" stroke="url(#pipeGrad)" stroke-width="6" filter="url(#bloom3)" />
    <path d="M 50,0 L 280,0 L 510,0 L 740,0 L 910,0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="10 10" />
    <circle cx="160" cy="0" r="7" fill="#0ea5e9" filter="url(#bloom3)" />
    <circle cx="395" cy="0" r="7" fill="#6366f1" filter="url(#bloom3)" />
    <circle cx="625" cy="0" r="7" fill="#a855f7" filter="url(#bloom3)" />
    <circle cx="825" cy="0" r="7" fill="#10b981" filter="url(#bloom3)" />
  </g>

  <!-- STAGE 1: RAW INPUT -->
  <g transform="translate(60, 260)">
    <rect width="215" height="190" rx="16" fill="rgba(11, 18, 33, 0.9)" stroke="#0ea5e9" stroke-width="2" />
    <rect width="215" height="36" rx="16" fill="rgba(0, 242, 254, 0.18)" />
    <text x="18" y="23" font-size="12" font-weight="900" fill="#0ea5e9" font-family="system-ui, sans-serif">1. INPUT SIGNALS</text>
    <g transform="translate(18, 55)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">Raw Data Stream</text>
      <text x="0" y="36" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Host kernel signals</text>
      <text x="0" y="54" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• User CLI / Webhook</text>
      <text x="0" y="72" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Unfiltered event payload</text>
      <text x="0" y="90" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• State change request</text>
    </g>
    <circle cx="107" cy="230" r="18" fill="url(#pGrad3)" />
    <text x="107" y="235" text-anchor="middle" font-size="14" font-weight="900" fill="#030712" font-family="system-ui, sans-serif">↓</text>
  </g>

