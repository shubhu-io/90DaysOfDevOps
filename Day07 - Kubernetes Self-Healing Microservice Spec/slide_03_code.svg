  <g transform="translate(295, 530)">
    <rect width="225" height="190" rx="16" fill="rgba(11, 18, 33, 0.9)" stroke="#6366f1" stroke-width="2" />
    <rect width="225" height="36" rx="16" fill="rgba(59, 130, 246, 0.18)" />
    <text x="18" y="23" font-size="12" font-weight="900" fill="#6366f1" font-family="system-ui, sans-serif">2. STRICT PARSER</text>
    <g transform="translate(18, 55)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">Defensive Runtime</text>
      <text x="0" y="36" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Tokenization engine</text>
      <text x="0" y="54" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Strict mode flags</text>
      <text x="0" y="72" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Defensive schema checks</text>
      <text x="0" y="90" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Signal trap handlers</text>
    </g>
    <circle cx="112" cy="-40" r="18" fill="url(#pGrad3)" />
    <text x="112" y="-35" text-anchor="middle" font-size="14" font-weight="900" fill="#030712" font-family="system-ui, sans-serif">↑</text>
  </g>

  <!-- STAGE 3: EVALUATION & ASSERTION GATES -->
  <g transform="translate(540, 260)">
    <rect width="225" height="190" rx="16" fill="rgba(11, 18, 33, 0.9)" stroke="#a855f7" stroke-width="2" />
    <rect width="225" height="36" rx="16" fill="rgba(139, 92, 246, 0.2)" />
    <text x="18" y="23" font-size="12" font-weight="900" fill="#a855f7" font-family="system-ui, sans-serif">3. THRESHOLD GATES</text>
    <g transform="translate(18, 55)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">SRE Health Evaluator</text>
      <text x="0" y="36" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Zero-drift comparison</text>
      <text x="0" y="54" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Latency budget assert</text>
      <text x="0" y="72" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Error threshold check</text>
      <text x="0" y="90" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Daemon status: active</text>
    </g>
    <circle cx="112" cy="230" r="18" fill="url(#pGrad3)" />
    <text x="112" y="235" text-anchor="middle" font-size="14" font-weight="900" fill="#030712" font-family="system-ui, sans-serif">↓</text>
  </g>

  <!-- STAGE 4: STRUCTURED OUTPUT EMISSION -->
  <g transform="translate(785, 530)">
    <rect width="235" height="190" rx="16" fill="rgba(11, 18, 33, 0.9)" stroke="#10b981" stroke-width="2" />
    <rect width="235" height="36" rx="16" fill="rgba(16, 185, 129, 0.18)" />
    <text x="18" y="23" font-size="12" font-weight="900" fill="#10b981" font-family="system-ui, sans-serif">4. TELEMETRY SINK</text>
    <g transform="translate(18, 55)">
      <text x="0" y="16" font-size="12" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">telemetry_report.json</text>
      <text x="0" y="36" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• ISO 8601 UTC Stamp</text>
      <text x="0" y="54" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Health Status: NOMINAL</text>
      <text x="0" y="72" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">• Zero-Drift Verified</text>
      <text x="0" y="90" font-size="10" font-weight="800" fill="#10b981" font-family="ui-monospace, monospace">● EXIT CODE: 0 (PASS)</text>
    </g>
    <circle cx="117" cy="-40" r="18" fill="url(#pGrad3)" />
    <text x="117" y="-35" text-anchor="middle" font-size="14" font-weight="900" fill="#030712" font-family="system-ui, sans-serif">↑</text>
  </g>

  <!-- Bottom Architectural Axiom Card -->
  <g transform="translate(60, 780)">
    <rect width="960" height="180" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <rect width="960" height="38" rx="18" fill="rgba(30, 41, 59, 0.6)" />
    <text x="24" y="24" font-size="12" font-weight="800" fill="#cbd5e1" font-family="ui-monospace, monospace">ARCHITECTURAL AXIOM // 2026 DEVOPS STANDARD</text>

    <g transform="translate(30, 60)">
      <text x="0" y="24" font-size="16" font-weight="800" fill="#ffffff" font-family="system-ui, sans-serif">"Never parse unvalidated strings when deterministic protocols exist."</text>
      <text x="0" y="52" font-size="13" fill="#94a3b8" font-family="system-ui, sans-serif">By extracting state directly from programmatic interfaces rather than brittle text scrapers,</text>
      <text x="0" y="72" font-size="13" fill="#94a3b8" font-family="system-ui, sans-serif">production pipelines achieve orders of magnitude higher reliability, minimal CPU overhead, and total immunity to UI drift.</text>
    </g>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(60, 990)">
    <text x="0" y="16" font-size="12" font-weight="700" fill="#64748b" font-family="system-ui, sans-serif">CONCEPT VISUALIZATION • 90 DAYS OF DEVOPS • SHUBHAM MANE</text>
    <text x="960" y="16" text-anchor="end" font-size="12" font-weight="800" fill="#10b981" font-family="system-ui, sans-serif">VERIFIED MECHANISM ✓</text>
  </g>
</svg>
