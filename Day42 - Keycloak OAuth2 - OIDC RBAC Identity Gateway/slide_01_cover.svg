  <!-- Level 3: Project Hero Title -->
  <text x="60" y="148" font-size="13" font-weight="800" fill="#ef4444" font-family="system-ui, sans-serif" letter-spacing="3">DEVSECOPS &amp; CLOUD SECURITY</text>
  <text x="60" y="180" font-size="34" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif" letter-spacing="-0.8">Keycloak OAuth2 - OIDC</text>
