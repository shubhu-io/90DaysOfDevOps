    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#heroBg)" />
  <rect width="1080" height="1080" fill="url(#heroGlow)" />

  <!-- 3D Perspective Isometric Grid Floor -->
  <g opacity="0.15" stroke="#ef4444" stroke-width="1">
    <line x1="540" y1="520" x2="-200" y2="1180" />
    <line x1="540" y1="520" x2="60" y2="1180" />
    <line x1="540" y1="520" x2="300" y2="1180" />
    <line x1="540" y1="520" x2="540" y2="1180" />
    <line x1="540" y1="520" x2="780" y2="1180" />
    <line x1="540" y1="520" x2="1020" y2="1180" />
    <line x1="540" y1="520" x2="1280" y2="1180" />
    <ellipse cx="540" cy="740" rx="380" ry="110" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3" />
    <ellipse cx="540" cy="850" rx="520" ry="150" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.4" />
    <ellipse cx="540" cy="980" rx="680" ry="190" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5" />
