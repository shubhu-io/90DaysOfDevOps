      <circle cx="16" cy="14" r="4" fill="#ff5f56" /><circle cx="28" cy="14" r="4" fill="#ffbd2e" /><circle cx="40" cy="14" r="4" fill="#27c93f" />
      <text x="54" y="18" font-size="10" font-weight="800" fill="#cbd5e1" font-family="ui-monospace, monospace">runtime_verification.sh</text>
      
      <text x="16" y="52" font-size="10" fill="#34d399" font-family="ui-monospace, monospace">$ ./verify --day 06</text>
