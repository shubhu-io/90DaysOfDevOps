    <line x1="540" y1="520" x2="60" y2="1180" />
    <line x1="540" y1="520" x2="300" y2="1180" />
    <line x1="540" y1="520" x2="540" y2="1180" />
    <line x1="540" y1="520" x2="780" y2="1180" />
    <line x1="540" y1="520" x2="1020" y2="1180" />
    <line x1="540" y1="520" x2="1280" y2="1180" />
    <ellipse cx="540" cy="740" rx="380" ry="110" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3" />
    <ellipse cx="540" cy="850" rx="520" ry="150" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.4" />
    <ellipse cx="540" cy="980" rx="680" ry="190" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" />
  </g>

